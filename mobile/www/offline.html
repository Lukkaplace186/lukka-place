<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lukka Place — hors ligne</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #FBF9F6; color: #1a1f2b; font-family: system-ui, sans-serif; }
    main { max-width: 22rem; margin: 0 auto; padding: 30vh 24px 24px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { font-size: 0.9375rem; line-height: 1.5; color: #4b5262; margin: 0 0 24px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #144FC5; color: #fff; font-size: 0.9375rem; font-weight: 700; }
  </style>
</head>
<body>
  <!-- capacitor.config.json server.errorPath: shown when lukkaplace.com cannot be reached. -->
  <main>
    <h1>Pas de connexion</h1>
    <p>Lukka Place a besoin d’internet pour afficher les annonces et votre espace. Vérifiez votre connexion puis réessayez.</p>
    <button type="button" onclick="window.location.replace('https://lukkaplace.com/app')">Réessayer</button>
  </main>
</body>
</html>
