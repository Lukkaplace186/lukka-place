<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1D5BD8">
  <meta name="robots" content="noindex">
  <title>Hors ligne — Lukka Place</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #FBF9F6; color: #101A2E;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #1D5BD8; margin: 0 0 28px; }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 999px; background: #E8EEFB;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.55; color: #4A5468; margin: 0 0 6px; }
    .en { font-size: 13px; color: #7A8394; margin-top: 12px; }
    button, a.home {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px;
      margin-top: 24px; border: 0; border-radius: 999px; background: #1D5BD8; color: #fff;
      font: inherit; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer;
    }
    a.home { margin-top: 10px; background: transparent; color: #1D5BD8; box-shadow: inset 0 0 0 1.5px #1D5BD8; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Lukka Place</p>
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D5BD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Pas de connexion internet</h1>
    <p>Cette page n’a pas pu se charger. Vérifiez vos données mobiles ou votre Wi-Fi, puis réessayez.</p>
    <p class="en">You are offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <a class="home" href="/">Accueil</a>
  </main>
</body>
</html>
